<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioAnalyzer Web-Vedruna</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark: #020205;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--dark);
            color: white; font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* --- LOGO REACTIVO DEL INSTITUTO --- */
        #logo-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 30;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #insti-logo {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 10px var(--neon-blue));
            transition: transform 0.05s ease-out;
        }

        .logo-placeholder {
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px;
            text-align: center;
            font-size: 0.6rem;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* --- INTERFAZ DE CONTROL --- */
        #controls {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%);
            z-index: 10; display: flex; gap: 10px;
            background: rgba(5, 5, 10, 0.85);
            padding: 12px 20px; border-radius: 50px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            backdrop-filter: blur(10px);
            align-items: center;
        }

        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 8px 16px;
            cursor: pointer; text-transform: uppercase; font-size: 0.7rem;
            border-radius: 20px; transition: all 0.2s;
        }

        .btn:hover, .btn.active {
            background: var(--neon-blue); color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 50; background: var(--dark);
        }

        .label-group { display: flex; flex-direction: column; align-items: center; margin: 0 10px; }
        .label-group label { font-size: 0.5rem; color: var(--neon-blue); margin-bottom: 4px; }
        input[type=range] { width: 80px; accent-color: var(--neon-blue); cursor: pointer; }
    </style>
</head>
<body>

    <div id="logo-container">
        <img src="Logo-VS-1.png" id="insti-logo" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block'">
        <div id="placeholder" class="logo-placeholder" style="display:none;">[ LOGO ]<br>INSTITUTO</div>
    </div>

    <div id="overlay">
        <h1 style="letter-spacing: 8px; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue);">AUDIO ANALYZER</h1>
        <button class="btn" onclick="startApp()" style="font-size: 1.2rem; padding: 15px 40px; border-radius: 5px;">INICIAR SISTEMA</button>
    </div>

    <div id="controls">
        <button class="btn active" onclick="setMode('bars', this)">Barras</button>
        <button class="btn" onclick="setMode('wave', this)">Onda</button>
        <button class="btn" onclick="setMode('circle', this)">Circular</button>
        <div class="label-group">
            <label>SENSIBILIDAD</label>
            <input type="range" id="gain" min="0.5" max="4" step="0.1" value="1.5">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        let audioCtx, analyser, dataArray, source;
        let mode = 'bars';
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const logo = document.getElementById('insti-logo');
        const placeholder = document.getElementById('placeholder');
        const gainControl = document.getElementById('gain');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        async function startApp() {
            document.getElementById('overlay').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512; // Resolución equilibrada para móvil/pc
            source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            draw();
        }

        function setMode(m, btn) {
            mode = m;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            // Fondo con rastro
            ctx.fillStyle = 'rgba(2, 2, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gain = parseFloat(gainControl.value);

            // --- REACCIÓN DEL LOGO (Bajos) ---
            let bass = 0;
            for(let i = 0; i < 5; i++) bass += dataArray[i];
            bass = bass / 5;
            let scale = 1 + (bass / 255) * 0.4;
            const target = logo.style.display !== 'none' ? logo : placeholder;
            target.style.transform = `scale(${scale})`;
            target.style.filter = `drop-shadow(0 0 ${15 * scale}px var(--neon-blue))`;

            // --- MODOS VISUALES ---
            if (mode === 'bars') {
                const barWidth = (canvas.width / dataArray.length) * 2.5;
                let x = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const h = (dataArray[i] / 255) * canvas.height * 0.6 * gain;
                    ctx.fillStyle = `hsla(${200 + (i * 2)}, 100%, 50%, 0.8)`;
                    ctx.fillRect(x, canvas.height - h, barWidth - 2, h);
                    x += barWidth;
                }
            } 
            else if (mode === 'wave') {
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f2ff';
                const sliceWidth = canvas.width / dataArray.length;
                let x = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const v = (dataArray[i] / 128.0) * gain;
                    const y = (v * canvas.height / 4) + (canvas.height / 2) - 100;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.stroke();
            } 
            else if (mode === 'circle') {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.3;
                for (let i = 0; i < dataArray.length; i++) {
                    const val = (dataArray[i] / 255) * 200 * gain;
                    const angle = (i / dataArray.length) * Math.PI * 2;
                    const xStart = centerX + Math.cos(angle) * radius;
                    const yStart = centerY + Math.sin(angle) * radius;
                    const xEnd = centerX + Math.cos(angle) * (radius + val);
                    const yEnd = centerY + Math.sin(angle) * (radius + val);
                    
                    ctx.strokeStyle = `hsla(${180 + (i*2)}, 100%, 50%, 0.7)`;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(xStart, yStart);
                    ctx.lineTo(xEnd, yEnd);
                    ctx.stroke();
                }
            }
        }
    </script>
</body>
</html>
